name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest httpx

      - name: Correr pruebas
       run: PYTHONPATH=. pytest -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: terraform fmt
        working-directory: infra/terraform-final
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: infra/terraform-final
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/terraform-final
        run: terraform validate

      # Las credenciales del Sandbox de AWS Academy son temporales (expiran
      # en horas). Antes de grabar el video, pega las 3 (access key, secret,
      # session token) frescas en Settings > Secrets and variables > Actions
      # de este repo. Si no están puestas, este paso falla y el resto del
      # pipeline (validación + pruebas) sigue siendo evidencia válida.
      - name: terraform plan
        working-directory: infra/terraform-final
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_app_repo_url: https://github.com/${{ github.repository }}.git
        run: terraform plan
